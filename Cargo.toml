[package]
name = "matrix-rain"
version = "0.1.0"
edition = "2021"

[dependencies]
# Usa o crossterm re-exportado (`ratatui::crossterm`, 0.29): uma só versão no build.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# Janela nativa (GPU), só com `--features desktop`.
ratatui-wgpu = { version = "0.6", default-features = false, optional = true }
winit = { version = "0.30", optional = true }
pollster = { version = "1", optional = true }

[features]
desktop = ["dep:ratatui-wgpu", "dep:winit", "dep:pollster"]

# `cargo bundle --release --features desktop` (.app / .msi / .deb).
[package.metadata.bundle]
name = "Matrix Rain"
identifier = "dev.verussa.matrix-rain"
icon = ["assets/icon.png"]
category = "public.app-category.entertainment"
short_description = "Chuva digital estilo Matrix"

# Otimizações de release: binário menor, loop mais rápido.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
