[package]
name = "matrix-rain"
version = "0.1.0"
edition = "2021"

[dependencies]
# Usa o crossterm re-exportado (`ratatui::crossterm`, 0.29): uma só versão no build.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
# Configuração persistente (config.toml no diretório de config do SO).
directories = "6.0.0"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Janela nativa (GPU), só com `--features desktop`.
ratatui-wgpu = { version = "0.6", default-features = false, optional = true }
winit = { version = "0.30", optional = true }
pollster = { version = "1", optional = true }
ratcn = { version = "0.0.6", features = ["crossterm"] }
tachyonfx = { version = "0.25", default-features = false, features = ["std", "std-duration"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }

[features]
desktop = ["dep:ratatui-wgpu", "dep:winit", "dep:pollster", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

# Ícone do Dock em tempo de execução (`make desktop` roda o binário solto, sem .app).
# Mesmas versões que o winit 0.30 já usa.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.5", optional = true }
objc2-app-kit = { version = "0.2", optional = true, default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.2", optional = true, default-features = false, features = ["NSData", "NSThread"] }

# `cargo bundle --release --features desktop` (.app / .msi / .deb).
[package.metadata.bundle]
name = "Matrix Rain"
identifier = "dev.verussa.matrix-rain"
icon = ["assets/icon.png"]
category = "public.app-category.entertainment"
short_description = "Chuva digital estilo Matrix"

# Otimizações de release: binário menor, loop mais rápido.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
